<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBER TASK - 星際特攻集點系統</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800;900&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0a12;
      --card-bg: rgba(18, 18, 32, 0.85);
      --primary: #00f0ff;
      --secondary: #7000ff;
      --accent: #ff007f;
      --warning: #ffaa00;
      --text: #e2e8f0;
      --border-glow: 0 0 10px rgba(0, 240, 255, 0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans TC', sans-serif; }
    
    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(112, 0, 255, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(0, 240, 255, 0.15) 0%, transparent 40%);
      color: var(--text);
      min-height: 100vh;
      padding: 20px;
    }

    .container { max-width: 900px; margin: 0 auto; }

    /* Header & Stats */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      background: var(--card-bg);
      border: 1px solid var(--primary);
      box-shadow: var(--border-glow);
      border-radius: 12px;
      margin-bottom: 25px;
      backdrop-filter: blur(8px);
    }

    .title-box h1 {
      font-family: 'Orbitron', sans-serif;
      color: var(--primary);
      font-size: 1.8rem;
      letter-spacing: 2px;
      text-shadow: 0 0 8px var(--primary);
    }

    .stats-container { display: flex; gap: 20px; }
    
    .stat-card {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--secondary);
      padding: 10px 18px;
      border-radius: 8px;
      text-align: center;
    }

    .stat-value {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      color: #fff;
    }

    .stat-label { font-size: 0.75rem; color: #a0aec0; }

    /* Monthly Progress */
    .progress-section {
      background: var(--card-bg);
      padding: 18px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 25px;
    }

    .progress-header { display: flex; justify-content: space-between; margin-bottom: 8px; font-weight: 700; }
    
    .progress-bar-bg {
      background: rgba(255, 255, 255, 0.1);
      height: 16px;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--secondary), var(--primary));
      box-shadow: 0 0 12px var(--primary);
      width: 0%;
      transition: width 0.4s ease;
    }

    /* Main Grid Layout */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .full-width {
      grid-column: 1 / -1;
    }

    @media (max-width: 768px) {
      .dashboard-grid { grid-template-columns: 1fr; }
      header { flex-direction: column; gap: 15px; text-align: center; }
    }

    .panel {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .panel-title {
      font-family: 'Orbitron', 'Noto Sans TC';
      font-size: 1.2rem;
      color: var(--primary);
      border-bottom: 2px solid var(--secondary);
      padding-bottom: 8px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Cards & Lists */
    .task-item, .log-item, .admin-item, .pending-item {
      background: rgba(255, 255, 255, 0.03);
      border-left: 4px solid var(--primary);
      padding: 12px 15px;
      margin-bottom: 10px;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .log-item { border-left-color: var(--secondary); }
    .pending-item { border-left-color: var(--warning); }

    .badge-pending {
      background: rgba(255, 170, 0, 0.2);
      color: var(--warning);
      border: 1px solid var(--warning);
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 12px;
      margin-left: 8px;
    }

    .prize-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 15px; }

    .prize-card {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      overflow: hidden;
      text-align: center;
      padding-bottom: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .prize-img { width: 100%; height: 100px; object-fit: cover; background: #1a1a2e; }

    /* Buttons */
    .btn {
      background: linear-gradient(135deg, var(--secondary), var(--primary));
      border: none;
      color: #fff;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:hover { transform: translateY(-2px); box-shadow: 0 0 10px var(--primary); }
    .btn:disabled { background: #4a5568; cursor: not-allowed; transform: none; box-shadow: none; }

    .btn-warning {
      background: linear-gradient(135deg, #d97706, #f59e0b);
    }

    .btn-success {
      background: linear-gradient(135deg, #059669, #10b981);
    }
    .btn-success:hover { box-shadow: 0 0 10px #10b981; }

    .btn-danger {
      background: linear-gradient(135deg, #ff0055, #ff007f);
    }
    .btn-danger:hover { box-shadow: 0 0 10px #ff0055; }

    .btn-admin {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      position: relative;
    }
    .btn-admin:hover { background: var(--accent); color: #fff; box-shadow: 0 0 10px var(--accent); }

    .notification-dot {
      position: absolute;
      top: -5px;
      right: -5px;
      background: var(--accent);
      color: white;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      font-size: 0.7rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    /* Modal / Admin Panel */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(5px);
      display: none; justify-content: center; align-items: center; z-index: 100;
    }

    .modal {
      background: var(--bg-dark);
      border: 1px solid var(--primary);
      box-shadow: var(--border-glow);
      padding: 25px;
      width: 90%; max-width: 550px;
      border-radius: 12px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-size: 0.9rem; }
    .form-group input {
      width: 100%; padding: 10px; background: rgba(255,255,255,0.05);
      border: 1px solid var(--secondary); color: #fff; border-radius: 6px;
    }

    .log-list {
      max-height: 220px;
      overflow-y: auto;
    }

    .action-group {
      display: flex;
      gap: 6px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="title-box">
        <h1>CYBER TASK</h1>
        <p style="font-size:0.8rem; color:#888;">星際特攻集點終端</p>
      </div>
      <div class="stats-container">
        <div class="stat-card">
          <div class="stat-value" id="totalPoints">0</div>
          <div class="stat-label">累積總能量</div>
        </div>
        <button class="btn btn-admin" onclick="openAdminModal()">
          家長控制台
          <span class="notification-dot" id="pendingBadge" style="display:none;">0</span>
        </button>
      </div>
    </header>

    <!-- 本月收集進度 -->
    <div class="progress-section">
      <div class="progress-header">
        <span id="currentMonthText">本月收集進度</span>
        <span id="monthlyPointsText">0 / 10 點</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressBar"></div>
      </div>
    </div>

    <div class="dashboard-grid">
      <!-- 任務區 -->
      <div class="panel">
        <div class="panel-title">
          <span>任務大廳</span>
          <span style="font-size:0.8rem; color:#aaa;">完成並回報獲取能量</span>
        </div>
        <div id="taskList"></div>
      </div>

      <!-- 獎品兌換區 -->
      <div class="panel">
        <div class="panel-title">
          <span>補給裝備庫</span>
          <span style="font-size:0.8rem; color:#aaa;">點數兌換</span>
        </div>
        <div class="prize-grid" id="prizeList"></div>
      </div>

      <!-- 點數獲取軌跡 -->
      <div class="panel full-width">
        <div class="panel-title">
          <span>獲取軌跡 (任務完成與審核記錄)</span>
          <span style="font-size:0.8rem; color:#aaa;">即時紀錄時間與點數</span>
        </div>
        <div class="log-list" id="logList"></div>
      </div>
    </div>
  </div>

  <!-- 家長驗證/管理 Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="authStep">
      <h2 style="color:var(--accent); margin-bottom:15px;">家長專區驗證</h2>
      <div class="form-group">
        <label>請輸入安全密碼：</label>
        <input type="password" id="adminPassword" placeholder="請輸入密碼">
      </div>
      <button class="btn" style="width:100%" onclick="checkPassword()">解鎖控制台</button>
      <button class="btn" style="width:100%; background:transparent; border:none; margin-top:10px;" onclick="closeModal()">取消</button>
    </div>

    <div class="modal" id="adminPanelStep" style="display:none;">
      <h2 style="color:var(--primary); margin-bottom:15px;">家長控制台</h2>
      
      <!-- 待審核任務區 -->
      <div style="border-bottom:1px solid #333; padding-bottom:15px; margin-bottom:15px;">
        <h3 style="font-size:1rem; margin-bottom:10px; color:var(--warning);">📋 待審核任務申請</h3>
        <div id="adminPendingList"></div>
      </div>

      <!-- 新增任務 -->
      <div style="border-bottom:1px solid #333; padding-bottom:15px; margin-bottom:15px;">
        <h3 style="font-size:1rem; margin-bottom:10px; color:var(--primary);">+ 發布新任務</h3>
        <div class="form-group">
          <input type="text" id="newTaskTitle" placeholder="任務名稱 (例: 整理房間)">
        </div>
        <div class="form-group">
          <input type="number" id="newTaskPoints" placeholder="獎勵點數 (1-10)" min="1" max="10">
        </div>
        <button class="btn" onclick="addTask()">發布任務</button>
      </div>

      <!-- 下架任務管理區 -->
      <div style="border-bottom:1px solid #333; padding-bottom:15px; margin-bottom:15px;">
        <h3 style="font-size:1rem; margin-bottom:10px; color:#ff0055;">🗑️ 下架任務管理</h3>
        <div id="adminTaskList"></div>
      </div>

      <!-- 新增獎品 -->
      <div style="border-bottom:1px solid #333; padding-bottom:15px; margin-bottom:15px;">
        <h3 style="font-size:1rem; margin-bottom:10px; color:var(--accent);">+ 上架新獎品</h3>
        <div class="form-group">
          <input type="text" id="newPrizeTitle" placeholder="獎品名稱 (例: 看電影)">
        </div>
        <div class="form-group">
          <input type="number" id="newPrizePoints" placeholder="所需點數">
        </div>
        <div class="form-group">
          <label>上架圖片：</label>
          <input type="file" id="newPrizeImage" accept="image/*">
        </div>
        <button class="btn" style="background:var(--accent);" onclick="addPrize()">上架獎品</button>
      </div>

      <!-- 下架商品管理區 -->
      <div style="border-bottom:1px solid #333; padding-bottom:15px; margin-bottom:15px;">
        <h3 style="font-size:1rem; margin-bottom:10px; color:#ff0055;">🗑️ 下架商品管理</h3>
        <div id="adminPrizeList"></div>
      </div>

      <button class="btn" style="width:100%; background:#4a5568;" onclick="closeModal()">關閉控制台</button>
    </div>
  </div>

  <script>
    // 預設資料結構
    const DEFAULT_DATA = {
      totalPoints: 0,
      monthlyPoints: 0,
      currentMonth: new Date().toISOString().slice(0, 7), // YYYY-MM
      tasks: [
        { id: 1, title: '按時完成功課', points: 2 },
        { id: 2, title: '主動幫忙倒垃圾', points: 1 }
      ],
      prizes: [],
      pending: [], // 待審核列表
      logs: []     // 通過審核的歷史軌跡
    };

    let appData = JSON.parse(localStorage.getItem('cyber_task_data')) || DEFAULT_DATA;
    if (!appData.logs) appData.logs = [];
    if (!appData.pending) appData.pending = [];

    // 初始化與月份檢查
    function init() {
      const nowMonth = new Date().toISOString().slice(0, 7);
      if (appData.currentMonth !== nowMonth) {
        appData.currentMonth = nowMonth;
        appData.monthlyPoints = 0; // 新月份重置每月配額，但保留 totalPoints
        saveData();
      }
      render();
    }

    function saveData() {
      localStorage.setItem('cyber_task_data', JSON.stringify(appData));
      render();
    }

    function render() {
      // 渲染點數與進度
      document.getElementById('totalPoints').innerText = appData.totalPoints;
      document.getElementById('monthlyPointsText').innerText = `${appData.monthlyPoints} / 10 點`;
      document.getElementById('currentMonthText').innerText = `本月收集進度 (${appData.currentMonth})`;
      
      const progressPercent = Math.min((appData.monthlyPoints / 10) * 100, 100);
      document.getElementById('progressBar').style.width = `${progressPercent}%`;

      // 渲染家長按鈕待審核提示紅點
      const pendingBadge = document.getElementById('pendingBadge');
      if (appData.pending.length > 0) {
        pendingBadge.style.display = 'flex';
        pendingBadge.innerText = appData.pending.length;
      } else {
        pendingBadge.style.display = 'none';
      }

      // 渲染任務區
      const taskContainer = document.getElementById('taskList');
      taskContainer.innerHTML = appData.tasks.length === 0 
        ? '<p style="color:#666; text-align:center;">目前沒有任務</p>'
        : appData.tasks.map(task => {
            const isPending = appData.pending.some(p => p.taskId === task.id);
            return `
              <div class="task-item">
                <div>
                  <strong>${task.title}</strong>
                  ${isPending ? '<span class="badge-pending">待審核中</span>' : ''}
                  <div style="font-size:0.8rem; color:var(--primary);">+${task.points} 能量點</div>
                </div>
                <button class="btn ${isPending ? 'btn-warning' : ''}" 
                        onclick="submitTaskForApproval(${task.id})" 
                        ${(appData.monthlyPoints >= 10 || isPending) ? 'disabled' : ''}>
                  ${appData.monthlyPoints >= 10 ? '本月已滿' : (isPending ? '待審核' : '回報完成')}
                </button>
              </div>
            `;
          }).join('');

      // 渲染獎品區
      const prizeContainer = document.getElementById('prizeList');
      prizeContainer.innerHTML = appData.prizes.length === 0
        ? '<p style="color:#666; text-align:center; grid-column: 1/-1;">補給庫空空如也</p>'
        : appData.prizes.map(prize => `
          <div class="prize-card">
            <img src="${prize.image || 'https://via.placeholder.com/150/121225/00f0ff?text=REWARD'}" class="prize-img" alt="${prize.title}">
            <div style="padding: 8px;">
              <div style="font-weight:700; font-size:0.9rem;">${prize.title}</div>
              <div style="font-size:0.8rem; color:var(--accent);">${prize.points} 點</div>
            </div>
            <button class="btn" style="margin: 0 8px;" onclick="redeemPrize(${prize.id})" ${appData.totalPoints < prize.points ? 'disabled' : ''}>
              兌換
            </button>
          </div>
        `).join('');

      // 渲染獲取軌跡
      const logContainer = document.getElementById('logList');
      logContainer.innerHTML = appData.logs.length === 0
        ? '<p style="color:#666; text-align:center;">尚無點數領取紀錄</p>'
        : appData.logs.slice().reverse().map(log => `
          <div class="log-item">
            <div>
              <strong>${log.taskTitle}</strong>
              <div style="font-size:0.75rem; color:#888;">回報: ${log.submittedAt || log.timestamp} | 審核通過: ${log.approvedAt || log.timestamp}</div>
            </div>
            <div style="font-weight:bold; color:var(--primary);">+${log.points} 點</div>
          </div>
        `).join('');

      // 渲染家長後台待審核列表
      const adminPendingContainer = document.getElementById('adminPendingList');
      adminPendingContainer.innerHTML = appData.pending.length === 0
        ? '<p style="color:#666; font-size:0.85rem;">目前沒有待審核的任務</p>'
        : appData.pending.map(p => `
          <div class="pending-item">
            <div>
              <strong>${p.taskTitle}</strong> <span style="color:var(--primary); font-size:0.85rem;">(+${p.points} 點)</span>
              <div style="font-size:0.75rem; color:#888;">回報時間: ${p.submittedAt}</div>
            </div>
            <div class="action-group">
              <button class="btn btn-success" onclick="approveTask('${p.id}')">通過</button>
              <button class="btn btn-danger" onclick="rejectTask('${p.id}')">駁回</button>
            </div>
          </div>
        `).join('');

      // 渲染家長後台的任務下架列表
      const adminTaskContainer = document.getElementById('adminTaskList');
      adminTaskContainer.innerHTML = appData.tasks.length === 0
        ? '<p style="color:#666; font-size:0.85rem;">目前沒有已發布的任務</p>'
        : appData.tasks.map(task => `
          <div class="admin-item">
            <div>
              <strong>${task.title}</strong>
              <span style="font-size:0.8rem; color:var(--primary); margin-left:8px;">(+${task.points} 點)</span>
            </div>
            <button class="btn btn-danger" onclick="removeTask(${task.id})">下架</button>
          </div>
        `).join('');

      // 渲染家長後台的商品下架列表
      const adminPrizeContainer = document.getElementById('adminPrizeList');
      adminPrizeContainer.innerHTML = appData.prizes.length === 0
        ? '<p style="color:#666; font-size:0.85rem;">目前沒有上架商品</p>'
        : appData.prizes.map(prize => `
          <div class="admin-item">
            <div>
              <strong>${prize.title}</strong>
              <span style="font-size:0.8rem; color:var(--accent); margin-left:8px;">(${prize.points} 點)</span>
            </div>
            <button class="btn btn-danger" onclick="removePrize(${prize.id})">下架</button>
          </div>
        `).join('');
    }

    // 格式化時間 (YYYY-MM-DD HH:mm:ss)
    function getFormattedTime() {
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const hh = String(now.getHours()).padStart(2, '0');
      const min = String(now.getMinutes()).padStart(2, '0');
      const ss = String(now.getSeconds()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd} ${hh}:${min}:${ss}`;
    }

    // 孩子回報任務完成（送出待審核）
    function submitTaskForApproval(taskId) {
      const task = appData.tasks.find(t => t.id === taskId);
      if (!task) return;

      if (appData.monthlyPoints + task.points > 10) {
        alert(`無法回報！若此任務通過，將超過本月上限 10 點（目前已收集 ${appData.monthlyPoints} 點）。`);
        return;
      }

      const submittedAt = getFormattedTime();

      appData.pending.push({
        id: 'p_' + Date.now(),
        taskId: task.id,
        taskTitle: task.title,
        points: task.points,
        submittedAt: submittedAt
      });

      saveData();
      alert(`📤 已成功送出【${task.title}】的完成回報！\n回報時間：${submittedAt}\n請提醒家長至控制台進行審核。`);
    }

    // 家長審核通過任務
    function approveTask(pendingId) {
      const pendingIndex = appData.pending.findIndex(p => p.id === pendingId);
      if (pendingIndex === -1) return;

      const p = appData.pending[pendingIndex];

      if (appData.monthlyPoints + p.points > 10) {
        if (!confirm(`通過此任務將使本月收集點數達到 ${appData.monthlyPoints + p.points} 點（超過每月 10 點建議值），確定仍要通過嗎？`)) {
          return;
        }
      }

      const approvedAt = getFormattedTime();

      appData.monthlyPoints += p.points;
      appData.totalPoints += p.points;

      // 新增審核通過軌跡紀錄
      appData.logs.push({
        id: Date.now(),
        taskTitle: p.taskTitle,
        points: p.points,
        submittedAt: p.submittedAt,
        approvedAt: approvedAt,
        timestamp: approvedAt
      });

      // 從待審核列表中移除
      appData.pending.splice(pendingIndex, 1);

      saveData();
      alert(`✅ 已通過【${p.taskTitle}】！孩子已獲得 +${p.points} 點！`);
    }

    // 家長駁回任務
    function rejectTask(pendingId) {
      const pendingIndex = appData.pending.findIndex(p => p.id === pendingId);
      if (pendingIndex === -1) return;

      const p = appData.pending[pendingIndex];

      if (confirm(`確定要駁回【${p.taskTitle}】的回報申請嗎？`)) {
        appData.pending.splice(pendingIndex, 1);
        saveData();
        alert(`❌ 已駁回【${p.taskTitle}】的申請。`);
      }
    }

    // 獎品兌換邏輯
    function redeemPrize(id) {
      const prize = appData.prizes.find(p => p.id === id);
      if (!prize) return;

      if (appData.totalPoints < prize.points) {
        alert('累積能量不足！');
        return;
      }

      if (confirm(`確定要消耗 ${prize.points} 點數兌換【${prize.title}】嗎？`)) {
        appData.totalPoints -= prize.points;
        saveData();
        alert('✨ 兌換成功！請向家長出示此畫面領取獎品！');
      }
    }

    /* Modal / 家長專區控制 */
    function openAdminModal() {
      document.getElementById('modalOverlay').style.display = 'flex';
      document.getElementById('authStep').style.display = 'block';
      document.getElementById('adminPanelStep').style.display = 'none';
      document.getElementById('adminPassword').value = '';
    }

    function closeModal() {
      document.getElementById('modalOverlay').style.display = 'none';
    }

    function checkPassword() {
      const pwd = document.getElementById('adminPassword').value;
      if (pwd === '1234') {
        document.getElementById('authStep').style.display = 'none';
        document.getElementById('adminPanelStep').style.display = 'block';
      } else {
        alert('密碼錯誤！');
      }
    }

    function addTask() {
      const title = document.getElementById('newTaskTitle').value.trim();
      const points = parseInt(document.getElementById('newTaskPoints').value);

      if (!title || !points || points < 1) {
        alert('請填寫正確的任務名稱與點數！');
        return;
      }

      appData.tasks.push({ id: Date.now(), title, points });
      saveData();
      document.getElementById('newTaskTitle').value = '';
      document.getElementById('newTaskPoints').value = '';
      alert('任務發布成功！');
    }

    // 下架任務功能
    function removeTask(id) {
      const task = appData.tasks.find(t => t.id === id);
      if (!task) return;

      if (confirm(`確定要下架任務【${task.title}】嗎？\n（若有此任務的待審核申請，也會一併關閉）`)) {
        // 移除任務
        appData.tasks = appData.tasks.filter(t => t.id !== id);
        // 清理該任務的待審核項目
        appData.pending = appData.pending.filter(p => p.taskId !== id);
        
        saveData();
        alert('任務已成功下架！');
      }
    }

    function addPrize() {
      const title = document.getElementById('newPrizeTitle').value.trim();
      const points = parseInt(document.getElementById('newPrizePoints').value);
      const fileInput = document.getElementById('newPrizeImage');

      if (!title || !points) {
        alert('請輸入獎品名稱與所需點數！');
        return;
      }

      const savePrizeObj = (imageData = '') => {
        appData.prizes.push({ id: Date.now(), title, points, image: imageData });
        saveData();
        document.getElementById('newPrizeTitle').value = '';
        document.getElementById('newPrizePoints').value = '';
        fileInput.value = '';
        alert('獎品上架成功！');
      };

      if (fileInput.files && fileInput.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          savePrizeObj(e.target.result);
        };
        reader.readAsDataURL(fileInput.files[0]);
      } else {
        savePrizeObj();
      }
    }

    // 下架獎品功能
    function removePrize(id) {
      const prize = appData.prizes.find(p => p.id === id);
      if (!prize) return;

      if (confirm(`確定要下架商品【${prize.title}】嗎？`)) {
        appData.prizes = appData.prizes.filter(p => p.id !== id);
        saveData();
        alert('商品已下架！');
      }
    }

    init();
  </script>
</body>
</html>
